```yaml
name: Connect to PureVPN New Zealand
  env:
    PUREVPN_USER: ${{ secrets.PUREVPN_USER }}
    PUREVPN_PASS: ${{ secrets.PUREVPN_PASS }}
  run: |
    set -euo pipefail

    echo "=== Installing OpenVPN ==="
    sudo apt-get update
    sudo apt-get install -y openvpn unzip curl

    echo "=== Downloading PureVPN certificates/config bundle ==="
    wget -q https://d11a57lttb2ffq.cloudfront.net/heartbleed/router/Recommended-CA2.zip
    unzip -o Recommended-CA2.zip

    echo "=== Checking PureVPN certificate files ==="
    test -f Recommended-CA2/Certificates/ca.crt
    test -f Recommended-CA2/Certificates/client.crt
    test -f Recommended-CA2/Certificates/client.key

    echo "=== Creating authentication file ==="
    printf '%s\n%s\n' "$PUREVPN_USER" "$PUREVPN_PASS" > auth.txt
    chmod 600 auth.txt

    echo "=== Creating New Zealand OpenVPN configuration ==="

    cat > nz2-auto-udp.ovpn <<'EOF'
    client
    dev tun
    proto udp

    remote nz2-auto-udp-obf.ptoserver.com 53

    resolv-retry infinite
    nobind
    persist-key
    persist-tun

    auth-user-pass auth.txt
    auth-nocache

    remote-cert-tls server

    ca Recommended-CA2/Certificates/ca.crt
    cert Recommended-CA2/Certificates/client.crt
    key Recommended-CA2/Certificates/client.key

    auth SHA256
    cipher AES-256-CBC

    verb 3

    ping 10
    ping-restart 60

    explicit-exit-notify 2

    redirect-gateway def1
    EOF

    chmod 600 nz2-auto-udp.ovpn

    echo "=== Starting PureVPN New Zealand ==="

    sudo openvpn \
      --config "$PWD/nz2-auto-udp.ovpn" \
      --auth-user-pass "$PWD/auth.txt" \
      --daemon \
      --log "$PWD/openvpn.log" \
      --writepid "$PWD/openvpn.pid"

    echo "=== Waiting for VPN tunnel ==="

    VPN_CONNECTED=false

    for i in {1..30}; do
      sleep 2

      if grep -q "Initialization Sequence Completed" openvpn.log 2>/dev/null; then
        VPN_CONNECTED=true
        break
      fi

      if grep -qE "AUTH_FAILED|TLS Error|Connection reset|Exiting due to fatal error" openvpn.log 2>/dev/null; then
        echo "OpenVPN reported a connection failure:"
        cat openvpn.log
        exit 1
      fi

      echo "Waiting for VPN... ($i/30)"
    done

    if [ "$VPN_CONNECTED" != "true" ]; then
      echo "VPN failed to establish within 60 seconds."
      echo "===== OpenVPN LOG ====="
      cat openvpn.log
      echo "======================="
      exit 1
    fi

    echo "=== PureVPN connected ==="

    echo "OpenVPN tunnel:"
    ip addr show tun0 || true

    echo ""
    echo "Public IP after VPN connection:"
    curl -4 --fail --silent --show-error https://api.ipify.org
    echo ""

    echo ""
    echo "IP information:"
    curl -4 --fail --silent --show-error https://ipinfo.io/json || true

    echo ""
    echo "=== VPN connection verified ==="

    # Keep the VPN process alive for the remainder of the job.
    if ! sudo kill -0 "$(cat openvpn.pid)" 2>/dev/null; then
      echo "OpenVPN process unexpectedly stopped."
      cat openvpn.log
      exit 1
    fi
```
