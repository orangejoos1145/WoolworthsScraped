name: Daily Woolies Scrape

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  update-deals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run API Scraper
        run: python Upgraded_Scraper.py

      - name: Generate HTML site
        run: python Site_Generator.py

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add woolworths_deals.csv index.html
          git commit -m "Automated daily deals update" || echo "No changes to commit"
          git push
