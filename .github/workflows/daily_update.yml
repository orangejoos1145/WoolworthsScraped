def fetch_page(page_index):
    payload = {
        "operationName": "ProductSearch",
        "variables": {
            "searchInput": {
                "byKeyword": {
                    "pageIndex": page_index,
                    "pageSize": PAGE_SIZE,
                    "value": "",
                    "sortBy": "RELEVANCE",
                    "facetFilters": [],
                    "staticFilters": ["SPECIALS"] 
                }
            }
        },
        "query": QUERY
    }

    print(f"Requesting page {page_index} (batch of {PAGE_SIZE})...")
    
    try:
        # Standard request running through the PureVPN OpenVPN tunnel
        response = requests.post(GRAPHQL_URL, headers=HEADERS, json=payload, timeout=15)
        
        if response.status_code != 200:
            print(f"Server rejected the request (Status {response.status_code}).")
            return None

        data = response.json()
        if "errors" in data:
            print("GraphQL Error:", data["errors"])
            return None
            
        return data.get("data", {}).get("My", {}).get("products", {})

    except requests.exceptions.Timeout:
        print("Error: Server connection timed out.")
        return None
    except requests.exceptions.RequestException as e:
        print(f"Connection error: {e}")
        return None
