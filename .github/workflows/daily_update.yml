name: Daily Woolies Scrape

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  update-deals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests urllib3

      - name: Connect to PureVPN New Zealand
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn unzip
          
          # Download official PureVPN configuration files and CA certificates
          wget https://d11a57lttb2ffq.cloudfront.net/heartbleed/router/Recommended-CA2.zip
          unzip Recommended-CA2.zip
          
          # Create authentication file with your credentials
          echo "purevpn0s12923268" > auth.txt
          echo "1rmBBVO0e9GOFQ" >> auth.txt
          chmod 600 auth.txt
          
          # Go to the newly extracted OpenVPN folder
          cd Recommended-CA2/OpenVPN/
          
          # Automatically find the New Zealand UDP config file
          NZ_CONFIG=$(ls *nz*-udp*.ovpn | head -n 1)
          if [ -z "$NZ_CONFIG" ]; then NZ_CONFIG=$(ls *nz*.ovpn | head -n 1); fi
          echo "Found NZ config: $NZ_CONFIG"
          
          # Start OpenVPN in the background
          sudo openvpn --config "$NZ_CONFIG" --auth-user-pass ../../auth.txt --daemon
          
          echo "Waiting 15 seconds for the VPN tunnel to establish..."
          sleep 15
          
          # Verify the IP changed (will print in the GitHub Actions log)
          curl ifconfig.me
          echo ""

      - name: Run API Scraper
        run: python Upgraded_Scraper.py

      - name: Generate HTML site
        run: python Site_Generator.py

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add woolworths_deals.csv index.html
          git commit -m "Automated daily deals update via PureVPN" || echo "No changes to commit"
          git push
